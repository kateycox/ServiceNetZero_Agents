<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Service Dashboard</title>
    <script src="https://cdn.plot.ly/plotly-2.26.0.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .dashboard-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            background: white;
            padding: 20px 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }
        
        h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #666;
            font-size: 1.1em;
        }
        
        .filters {
            background: white;
            padding: 20px 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        
        .filter-group {
            display: flex;
            flex-direction: column;
        }
        
        .filter-group label {
            font-weight: 600;
            margin-bottom: 5px;
            color: #555;
        }
        
        .filter-group input,
        .filter-group select {
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        .filter-group input:focus,
        .filter-group select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .summary-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s;
        }
        
        .card:hover {
            transform: translateY(-5px);
        }
        
        .card h3 {
            color: #667eea;
            font-size: 1em;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .card .value {
            font-size: 2.5em;
            font-weight: bold;
            color: #333;
        }
        
        .card .unit {
            color: #999;
            font-size: 0.9em;
        }
        
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 30px;
        }
        
        .chart-container {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .chart-container h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.3em;
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: transform 0.2s;
        }
        
        .btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <header>
            <h1>🍽️ Food Service Dashboard</h1>
            <p class="subtitle">Data-driven insights for optimal food service management</p>
        </header>
        
        <div class="filters">
            <div class="filter-group">
                <label>Start Date</label>
                <input type="date" id="startDate" value="">
            </div>
            <div class="filter-group">
                <label>End Date</label>
                <input type="date" id="endDate" value="">
            </div>
            <div class="filter-group">
                <label>Location</label>
                <select id="location">
                    <option value="">All Locations</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Ingredient</label>
                <select id="ingredient">
                    <option value="">All Ingredients</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Meal Period</label>
                <select id="mealPeriod">
                    <option value="">All Periods</option>
                    <option value="breakfast">Breakfast</option>
                    <option value="lunch">Lunch</option>
                    <option value="dinner">Dinner</option>
                    <option value="brunch">Brunch</option>
                </select>
            </div>
            <div class="filter-group" style="align-self: end;">
                <button class="btn" onclick="applyFilters()">Apply Filters</button>
            </div>
        </div>
        
        <div class="summary-cards" id="summaryCards">
            <div class="card">
                <h3>Total Events</h3>
                <div class="value" id="totalEvents">-</div>
            </div>
            <div class="card">
                <h3>Total Guests</h3>
                <div class="value" id="totalGuests">-</div>
            </div>
            <div class="card">
                <h3>Food Prepared</h3>
                <div class="value" id="totalPrepared">-</div>
                <div class="unit">lbs</div>
            </div>
            <div class="card">
                <h3>Food Wasted</h3>
                <div class="value" id="totalWasted">-</div>
                <div class="unit">lbs</div>
            </div>
            <div class="card">
                <h3>Waste Percentage</h3>
                <div class="value" id="wastePercentage">-</div>
                <div class="unit">%</div>
            </div>
        </div>
        
        <div class="charts-grid">
            <div class="chart-container">
                <h2>📊 Waste Distribution</h2>
                <div id="wasteChart"></div>
            </div>
            <div class="chart-container">
                <h2>📈 Usage Timeline</h2>
                <div id="timelineChart"></div>
            </div>
            <div class="chart-container">
                <h2>🏢 Location Comparison</h2>
                <div id="locationChart"></div>
            </div>
            <div class="chart-container">
                <h2>🍳 Meal Period Breakdown</h2>
                <div id="mealPeriodChart"></div>
            </div>
        </div>
    </div>
    
    <script>
        // Set default dates
        const today = new Date();
        const thirtyDaysAgo = new Date(today);
        thirtyDaysAgo.setDate(today.getDate() - 30);
        
        document.getElementById('startDate').value = thirtyDaysAgo.toISOString().split('T')[0];
        document.getElementById('endDate').value = today.toISOString().split('T')[0];
        
        // Load dashboard on page load
        window.addEventListener('load', () => {
            loadFilterOptions();
            applyFilters();
        });
        
        async function loadFilterOptions() {
            try {
                const response = await fetch('/filters/options');
                const data = await response.json();
                
                if (data.success) {
                    // Populate location dropdown
                    const locationSelect = document.getElementById('location');
                    data.data.locations.forEach(loc => {
                        const option = document.createElement('option');
                        option.value = loc;
                        option.textContent = loc;
                        locationSelect.appendChild(option);
                    });
                    
                    // Populate ingredient dropdown
                    const ingredientSelect = document.getElementById('ingredient');
                    data.data.ingredients.forEach(ing => {
                        const option = document.createElement('option');
                        option.value = ing;
                        option.textContent = ing;
                        ingredientSelect.appendChild(option);
                    });
                }
            } catch (error) {
                console.error('Error loading filter options:', error);
            }
        }
        
        async function applyFilters() {
            const filters = {
                start_date: document.getElementById('startDate').value,
                end_date: document.getElementById('endDate').value,
                location: document.getElementById('location').value || null,
                ingredient: document.getElementById('ingredient').value || null,
                meal_period: document.getElementById('mealPeriod').value || null
            };
            
            // Load summary
            await loadSummary(filters);
            
            // Load charts
            await loadCharts(filters);
        }
        
        async function loadSummary(filters) {
            try {
                const params = new URLSearchParams(filters).toString();
                const response = await fetch(`/dashboard/summary?${params}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(filters)
                });
                
                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('totalEvents').textContent = data.data.total_events;
                    document.getElementById('totalGuests').textContent = data.data.total_guests;
                    document.getElementById('totalPrepared').textContent = data.data.total_prepared_lb;
                    document.getElementById('totalWasted').textContent = data.data.total_wasted_lb;
                    document.getElementById('wastePercentage').textContent = data.data.waste_percentage;
                }
            } catch (error) {
                console.error('Error loading summary:', error);
            }
        }
        
        async function loadCharts(filters) {
            // Load waste chart
            try {
                const response = await fetch('/charts/waste-overview', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(filters)
                });
                const chartData = await response.json();
                
                Plotly.newPlot('wasteChart', [{
                    values: chartData.data.values,
                    labels: chartData.data.labels,
                    type: 'pie',
                    marker: {
                        colors: ['#667eea', '#764ba2', '#f093fb', '#4facfe', '#43e97b']
                    }
                }], {
                    height: 350,
                    margin: { t: 0, b: 0, l: 0, r: 0 }
                });
            } catch (error) {
                console.error('Error loading waste chart:', error);
            }
            
            // Load timeline chart
            try {
                const response = await fetch('/charts/timeline', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(filters)
                });
                const chartData = await response.json();
                
                Plotly.newPlot('timelineChart', [
                    {
                        x: chartData.data.dates,
                        y: chartData.data.prepared,
                        name: 'Prepared',
                        type: 'scatter',
                        mode: 'lines+markers',
                        line: { color: '#667eea' }
                    },
                    {
                        x: chartData.data.dates,
                        y: chartData.data.used,
                        name: 'Used',
                        type: 'scatter',
                        mode: 'lines+markers',
                        line: { color: '#43e97b' }
                    },
                    {
                        x: chartData.data.dates,
                        y: chartData.data.wasted,
                        name: 'Wasted',
                        type: 'scatter',
                        mode: 'lines+markers',
                        line: { color: '#f093fb' }
                    }
                ], {
                    height: 350,
                    margin: { t: 20, b: 40, l: 50, r: 20 }
                });
            } catch (error) {
                console.error('Error loading timeline chart:', error);
            }
        }
    </script>
</body>
</html>
